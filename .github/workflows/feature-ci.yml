name: Feature Branch CI

on:
  push:
    branches:
      - 'feat/**'
      - 'contract/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Scope manifest present
        run: |
          if [ ! -f SCOPE.json ]; then
            echo "❌ SCOPE.json missing from feature branch"
            exit 1
          fi

  integration-check:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebase onto main and test
        run: |
          git config user.email "ci@nodots.dev"
          git config user.name "CI"
          git fetch origin ${{ github.ref_name }}
          git checkout ${{ github.ref_name }}
          git rebase origin/main
          npm ci
          npm test

  notify-slack:
    runs-on: ubuntu-latest
    needs: [validate, integration-check]
    if: failure()
    permissions:
      contents: read
    steps:
      - name: Notify Slack of CI failure
        env:
          SLACK_WEBHOOK_ALERTS: ${{ secrets.SLACK_WEBHOOK_ALERTS }}
        run: |
          if [ -z "$SLACK_WEBHOOK_ALERTS" ]; then
            echo "SLACK_WEBHOOK_ALERTS secret not configured — skipping"
            exit 0
          fi
          cat > /tmp/slack-ci.json << 'CI_EOF'
          {
            "text": ":x: CI failed on ${{ github.ref_name }}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ":x: *CI Failed*\nBranch: `${{ github.ref_name }}`\nCommit: `${{ github.sha }}`\nPushed by: *${{ github.actor }}*"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View Run" },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }
          CI_EOF
          curl -s -X POST -H 'Content-type: application/json' \
            --data @/tmp/slack-ci.json \
            "$SLACK_WEBHOOK_ALERTS"
