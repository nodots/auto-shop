name: Feature Branch CI

on:
  push:
    branches:
      - 'feat/**'
      - 'contract/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Scope manifest present
        run: |
          SCOPE_PATH="$(node scripts/hooks/resolve-cell-artifact.js path scope "$PWD")"
          if [ ! -f "$SCOPE_PATH" ]; then
            echo "❌ Scope manifest missing from feature branch ($SCOPE_PATH)"
            exit 1
          fi

      - name: JavaScript syntax
        run: |
          node --check bin/auto-shop
          node --check scripts/enforce-scope.js
          node --check scripts/hooks/enforce-scope-pretooluse.js
          node --check scripts/hooks/resolve-cell-artifact.js

      - name: Shell syntax
        run: |
          bash -n scripts/hooks/check-handoff-on-complete.sh
          bash -n scripts/hooks/check-handoff-on-stop.sh
          bash -n scripts/setup-claude-infra.sh

      - name: Whitespace check
        run: git diff --check

  integration-check:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebase onto main and validate
        run: |
          git config user.email "ci@nodots.dev"
          git config user.name "CI"
          git fetch origin ${{ github.ref_name }}
          git checkout ${{ github.ref_name }}
          git rebase origin/main
          npm ci
          SCOPE_PATH="$(node scripts/hooks/resolve-cell-artifact.js path scope "$PWD")"
          test -f "$SCOPE_PATH"
          node --check bin/auto-shop
          node --check scripts/enforce-scope.js
          node --check scripts/hooks/enforce-scope-pretooluse.js
          node --check scripts/hooks/resolve-cell-artifact.js
          bash -n scripts/hooks/check-handoff-on-complete.sh
          bash -n scripts/hooks/check-handoff-on-stop.sh
          bash -n scripts/setup-claude-infra.sh
          git diff --check
