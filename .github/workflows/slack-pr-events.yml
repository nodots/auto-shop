name: Slack — PR Events

on:
  pull_request:
    types: [opened, closed, ready_for_review]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Build notification payload
        id: payload
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$ACTION" = "opened" ]; then
            EMOJI=":new:"
            VERB="opened"
          elif [ "$ACTION" = "closed" ] && [ "$MERGED" = "true" ]; then
            EMOJI=":white_check_mark:"
            VERB="merged"
          elif [ "$ACTION" = "closed" ]; then
            EMOJI=":no_entry_sign:"
            VERB="closed without merge"
          elif [ "$ACTION" = "ready_for_review" ]; then
            EMOJI=":eyes:"
            VERB="ready for review"
          else
            EMOJI=":pull_request:"
            VERB="$ACTION"
          fi

          cat > /tmp/slack-payload.json << PAYLOAD_EOF
          {
            "channel": "auto-shop-cells",
            "text": "${EMOJI} PR #${PR_NUMBER} *${PR_TITLE}* ${VERB} by ${ACTOR}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "${EMOJI} <${PR_URL}|PR #${PR_NUMBER} ${PR_TITLE}>\n${VERB} by *${ACTOR}*\nBranch: \`${PR_BRANCH}\`"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View PR" },
                    "url": "${PR_URL}"
                  }
                ]
              }
            ]
          }
          PAYLOAD_EOF

      - name: Send to #auto-shop-cells
        env:
          SLACK_WEBHOOK_CELLS: ${{ secrets.SLACK_WEBHOOK_CELLS }}
        run: |
          if [ -z "$SLACK_WEBHOOK_CELLS" ]; then
            echo "SLACK_WEBHOOK_CELLS secret not configured — skipping"
            exit 0
          fi
          curl -s -X POST -H 'Content-type: application/json' \
            --data @/tmp/slack-payload.json \
            "$SLACK_WEBHOOK_CELLS"

      - name: Send to #auto-shop-alerts (READY PRs)
        if: >-
          github.event.action == 'opened' &&
          startsWith(github.event.pull_request.title, '[READY]')
        env:
          SLACK_WEBHOOK_ALERTS: ${{ secrets.SLACK_WEBHOOK_ALERTS }}
        run: |
          if [ -z "$SLACK_WEBHOOK_ALERTS" ]; then
            echo "SLACK_WEBHOOK_ALERTS secret not configured — skipping"
            exit 0
          fi
          cat > /tmp/slack-alert.json << ALERT_EOF
          {
            "text": ":white_check_mark: PR ready for review: #${{ github.event.pull_request.number }} ${{ github.event.pull_request.title }}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ":white_check_mark: *Cell Complete — PR Ready*\n<${{ github.event.pull_request.html_url }}|PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.title }}>\nBranch: \`${{ github.event.pull_request.head.ref }}\`"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "Review PR" },
                    "url": "${{ github.event.pull_request.html_url }}"
                  }
                ]
              }
            ]
          }
          ALERT_EOF
          curl -s -X POST -H 'Content-type: application/json' \
            --data @/tmp/slack-alert.json \
            "$SLACK_WEBHOOK_ALERTS"
